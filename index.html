<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f0f10">
<title>GeneticTools</title>
<style>
:root{--bg:#0f0f10;--surface:#1a1a1c;--line:#2e2e32;--text:#f4f4f5;--muted:#8c8c92;--accent:#ff6b35;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:clamp(28px,6vw,72px) max(5vw,18px)}
h1{font-size:clamp(32px,6vw,48px);letter-spacing:-.02em;line-height:1.05}
h1 span{color:var(--accent)}
p{color:var(--muted);margin-top:8px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px;margin-top:36px;max-width:1100px}
a.card{display:flex;gap:16px;align-items:center;padding:18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);color:inherit;text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--accent);outline:none}
a.card img{width:64px;height:64px;border-radius:16px;flex:none}
a.card b{font-size:18px;display:block}
a.card span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<h1>Genetic<span>Tools</span></h1>
<p>Mes outils perso. Tout tourne dans le navigateur, rien n'est envoyé en ligne.</p>
<div class="list">
  <a class="card" href="retouche-pdf/"><img src="retouche-pdf/icons/icon-192.png" alt=""><div><b>Retouche PDF</b><span>Modifier le texte d'un PDF en gardant ses polices d'origine.</span></div></a>
</div>
</body>
</html>
